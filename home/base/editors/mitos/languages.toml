[language-server.taplo]
command = "taplo"
args = ["lsp", "stdio"]
environment = { RUST_LOG = "error" }

[language-server.typos]
command = "typos-lsp"
config.diagnosticSeverity = "Hint"

[language-server.metals]
command = "metals"
environment = { "SBT_TPOLECAT_DEV" = "1" }

[language-server.metals.config]
isHttpEnabled = true
icons = "unicode"

[language-server.metals.config.metals]
autoImportBuild = "all"
defaultBspToBuildTool = false
showImplicitArguments = true
showImplicitConversionsAndClasses = true
showInferredType = true
superMethodLensesEnabled = true
startMcpServer = true

[language-server.metals.config.metals.inlayHints]
inferredTypes.enable = true
typeParameters.enable = false
hintsInPatternMatch.enable = true
implicitArguments.enable = true
implicitConversions.enable = false
hintsXRayMode.enable = true

[language-server.mpls]
command = "mpls"
args = ["--dark-mode", "--enable-emoji", "--no-auto"]

[language-server.kotlin-lsp]
command = "kotlin-lsp"
args = ["--stdio"]
timeout = 120

[language-server.terraform-ls]
command = "terraform-ls"
args = ["serve", "-log-file", "/dev/null"]

[language-server.nixd]
command = "nixd"
args = ["--log=error"]

[[language]]
name = "css"
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
] }
auto-format = true
language-servers = ["vscode-css-language-server", "typos"]

[[language]]
name = "docker-compose"
language-servers = ["docker-language-server", "yaml-language-server", "typos"]

[[language]]
name = "env"
language-servers = ["typos"]

[[language]]
name = "fish"
auto-format = false
language-servers = ["fish-lsp", "typos"]

[[language]]
