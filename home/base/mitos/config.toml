theme = "catppuccin_macchiato"

# Experiment
# TODO Try native snippets: https://mitos.computer/docs/snippets
# TODO Try out quicklist: https://mitos.computer/docs/quicklist
# TODO How does search and replace work: https://mitos.computer/docs/search
# TODO Try native spell checking: https://mitos.computer/docs/spell-checking

[editor]
line-number = "relative"
whitespace.render = "all"
shell = ["fish", "-c"]
idle-timeout = 50
text-width = 120
icons = true
border-style = "rounded"

[editor.cursor]
highlight-line = true

[editor.cursor.shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.completion]
trigger-delay = 5
trigger-length = 0
preview-insert = false
word.trigger-length = 2

[editor.rulers]
columns = [120]

[editor.rainbow-brackets]
enable = true

[editor.bufferline]
show = "always"

[editor.breadcrumb]
enable = true
path = "none"

[editor.statusline]
left = [
  "mode",
  "spacer",
  "spinner",
  "diagnostics",
  "file-type",
  "separator",
  "spacer",
  "branch",
]
right = [
  "selections",
  "position",
  "file-line-ending",
  "file-encoding",
  "file-indent-style",
]
separator = "|"
mode.color = true
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
skip-levels = 1

[editor.inline-blame]
show = "cursor-line"

[editor.lsp]
document-highlight.auto-trigger = true
progress.enable = true
references.include-declaration = false

[editor.diagnostics.inline]
cursor-line = "hint"
other-lines = "disable"

[editor.diagnostics.end-of-line]
severity = "hint"

[keys.insert]
C-p = ["signature_help"]

[keys.select]
X = ["extend_line_above"]

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
ret = ["goto_word"]
C-p = ["signature_help"]
X = ["extend_line_above"]
"*" = ["search_selection"]
C-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
C-k = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
]

[keys.normal.space]
f = "file_picker_in_current_directory"
F = "file_picker"

[keys.normal.space.space]
label = "Git"
r = { label = "Restore change", command = ":restore-change" }
w = { label = "Open selection on GitHub", command = ":sh gh_browse %{buffer_name} %{selection_line_start} %{selection_line_end}" }
W = { label = "Open file on GitHub", command = ":sh gh_browse %{buffer_name}" }

[keys.normal."+"]
label = "LSP"
r = { label = "Restart language server", command = ":lsp-restart" }
s = { label = "Stop language server", command = ":lsp-stop" }
l = { label = "Workspace commands", command = ":lsp-workspace-command" }
b = { label = "Compile cascade", command = ":lsp-workspace-command compile-cascade" }
i = { label = "Import build", command = ":lsp-workspace-command build-import" }

[keys.normal."§"]
label = "Toggles"
f = { label = "Format on save", command = ":toggle-option format.on-save" }
h = { label = "Hidden files", command = ":toggle-option file-picker.hidden" }
g = { label = "Respect gitignore", command = ":toggle-option file-picker.git-ignore" }
i = { label = "Inlay hints", command = ":toggle-option lsp.inlay-hints.enable" }
w = { label = "Soft wrap", command = ":toggle-option soft-wrap.enable" }

[keys.normal."'"]
label = "Editing"
f = { label = "Format", command = ":format" }
w = { label = "Close buffer", command = ":buffer-close" }
W = { label = "Close other buffers", command = ":buffer-close-others" }
r = { label = "Reload all buffers", command = ":reload-all" }
g = { label = "Restore change", command = ":restore-change" }
")" = "rotate_selection_contents_forward"
"(" = "rotate_selection_contents_backward"
s = { label = "Sort selected lines", command = [
  "split_selection_on_newline",
  ":sort",
] }
y = "yank_joined"
Y = "yank_joined_to_clipboard"

[keys.normal.backspace]
label = "Popups"
g = { label = "Lazygit", command = ":sh open_popup lazygit" }
f = { label = "Yazi", command = ":sh open_popup yazi open %{buffer_name}" }
F = { label = "Broot", command = ":sh open_popup broot open" }
d = { label = "GH Dash", command = ":sh open_popup gh-dash" }
m = { label = "Leaf", command = ''':sh open_popup leaf "%{buffer_name}"''' }
p = { label = "Switch PR", command = ":sh open_popup gh-pr-switch" }
s = { label = "Search and replace", command = ":sh open_popup serpl" }
